modal=function(t){draft={statuses:['处理中','已完结'],start:'',end:''};notice='';generation++;initialModal(t)};
function remember(){if($('#processing'))draft.statuses=[$('#processing').checked?'处理中':'', $('#done').checked?'已完结':''].filter(Boolean);if($('#start'))draft.start=$('#start').value;if($('#end'))draft.end=$('#end').value}
formBody=function(t){let html=initialForm(t);html=html.replace('id="processing" checked','id="processing" '+(draft.statuses.includes('处理中')?'checked':''));html=html.replace('id="done" checked','id="done" '+(draft.statuses.includes('已完结')?'checked':''));html=html.replace(/id="start" value="[^"]*"/,'id="start" value="'+draft.start+'"').replace(/id="end" value="[^"]*"/,'id="end" value="'+draft.end+'"');return html};
drawModal=function(){initialDraw();if(state==='busy')$('.close').disabled=true;if(notice&&state!=='busy'&&state!=='success')$('.modal-body').insertAdjacentHTML('beforeend','<div class="error" role="alert">'+esc(notice)+'</div>');if(['form','empty','fail'].includes(state)){const invalid=!draft.statuses.length||(dateMode==='custom'&&(!draft.start||!draft.end||draft.start>draft.end));$('[data-confirm]').disabled=invalid;if(!draft.statuses.length&&!notice)$('.checks').insertAdjacentHTML('afterend','<div class="error">请至少选择一个工单状态</div>');}if(state==='fail')$('.error').textContent='导出失败，请重试。本次未生成文件。';};
confirmExport=function(){if(state==='busy')return;remember();notice='';if(!draft.statuses.length){notice='请至少选择一个工单状态';drawModal();return}if(dateMode==='custom'&&(!draft.start||!draft.end||draft.start>draft.end)){notice='请填写起止日期，开始日期不得晚于结束日期';drawModal();return}const id=++generation,t=selected,mode=dateMode,conditions=structuredClone(draft);state='busy';drawModal();setTimeout(()=>{if(id!==generation||selected!==t)return;if(scene==='fail'&&failOnce){failOnce=false;state='fail';drawModal();return}const rows=tickets.filter(x=>x.templateId===t.id&&x.org==='right'&&x.source==='用户提交'&&conditions.statuses.includes(x.status)&&(mode==='all'||(x.created.slice(0,10)>=conditions.start&&x.created.slice(0,10)<=conditions.end))).sort((a,b)=>a.created.localeCompare(b.created)||a.id.localeCompare(b.id));if(!rows.length){state='empty';drawModal();return}const st=conditions.statuses.length===2?'全部状态':conditions.statuses[0],dr=mode==='all'?'全部日期':conditions.start.replaceAll('-','')+'-'+conditions.end.replaceAll('-',''),stamp=new Date().toLocaleString('sv-SE',{timeZone:'Asia/Shanghai'}).replace(/\D/g,'');downloaded={rows:structuredClone(rows),count:rows.length,status:st,date:mode==='all'?'全部':conditions.start+' 至 '+conditions.end,name:`用户工单_${t.name.replace(/[\\/:*?"<>|]/g,'_')}_${st}_${dr}_${stamp}.xlsx`};state='success';drawModal()},650)};
for(const x of tickets){x.templateId=x.template===templates[0].name?'t1':'t2';x.org='right';x.source='用户提交';}
// 附件URL是明确标识的示例值；无生产媒体服务参与本原型。
const initialRender=renderRows;renderRows=function(){let old=scene;if(scene==='empty')scene='list';initialRender();scene=old;};
const scenes=[['list','模板配置'],['export','导出条件'],['empty','无匹配工单'],['fail','导出失败与重试'],['permission','普通客服无权限'],['loading','列表加载中'],['list-error','列表加载失败'],['no-templates','无模板']];
$('#scene').innerHTML=scenes.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
function enterScene(s){generation++;scene=scenes.some(x=>x[0]===s)?s:'list';failOnce=true;selected=null;downloaded=null;$('#overlay').classList.add('hidden');$('#scene').value=scene;$('#create').disabled=scene==='permission';renderRows();if(scene==='no-templates')$('#rows').innerHTML='<tr><td colspan="6"><div class="empty"><b>还没有工单类型</b>可通过原创建入口配置工单类型。</div></td></tr>';if(scene==='loading')$('#rows').innerHTML='<tr><td colspan="6"><div class="busy"><div class="spinner"></div>正在加载工单类型…</div></td></tr>';if(scene==='list-error')$('#rows').innerHTML='<tr><td colspan="6"><div class="empty"><b>工单类型加载失败</b><button class="btn" data-list-retry>重试</button></div></td></tr>';if(['export','fail','empty'].includes(scene)){modal(scene==='empty'?templates[2]:templates[0]);}}
$('#scene').onchange=e=>{const p=new URLSearchParams(location.search);p.set('scene',e.target.value);history.replaceState(null,'','?'+p);enterScene(e.target.value)};
document.addEventListener('change',e=>{if(e.target.closest('.modal')){remember();if(e.target.name==='dm')dateMode=e.target.value;notice='';if(state!=='success'&&state!=='busy')state='form';drawModal()}},true);
document.addEventListener('input',e=>{if(e.target.matches('#start,#end')){remember();let b=$('[data-confirm]');if(b)b.disabled=!draft.statuses.length||!draft.start||!draft.end||draft.start>draft.end;}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(state==='busy'&&b.closest('.overlay')){e.stopImmediatePropagation();return}if(b.hasAttribute('data-redo')){downloaded=null;notice='';}if(b.dataset.preview||b.dataset.edit||b.dataset.delete||b.classList.contains('nav'))alert('这是原有功能入口，本原型演示工单模板导出。');if(b.hasAttribute('data-list-retry'))enterScene('list');},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state!=='busy')$('#overlay').classList.add('hidden');if(e.key==='Tab'&&!$('#overlay').classList.contains('hidden')){const items=[...$('.modal').querySelectorAll('button:not(:disabled),input:not(:disabled)')].filter(x=>x.getClientRects().length);if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===items.at(-1)){e.preventDefault();items[0].focus()}}});
const originalZip=zip;zip=function(files){for(const f of files){if(f[0]==='xl/worksheets/sheet1.xml')f[1]=f[1].replace('<sheetData>','<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols><col min="1" max="4" width="23" customWidth="1"/><col min="5" max="100" width="32" customWidth="1"/></cols><sheetData>').replaceAll('<c t="inlineStr">','<c s="1" t="inlineStr">');if(f[0]==='[Content_Types].xml')f[1]=f[1].replace('</Types>','<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>');if(f[0]==='xl/_rels/workbook.xml.rels')f[1]=f[1].replace('</Relationships>','<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');}files.push(['xl/styles.xml','<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="1"><font><sz val="11"/><name val="Microsoft YaHei"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="2"><xf/><xf applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs></styleSheet>']);return originalZip(files)};
if(new URLSearchParams(location.search).get('embed')==='1'){document.head.insertAdjacentHTML('beforeend','<style>.demo,.side,.top{display:none}.shell{padding-left:0}.workspace{padding:20px;max-width:none}</style>')}
document.head.insertAdjacentHTML('beforeend','<style>button:disabled{cursor:default;opacity:.5}.modal{display:flex;flex-direction:column;overflow:hidden}.modal-body{overflow:auto}.modal-head,.modal-foot{flex-shrink:0}</style>');
enterScene(scene);
</script></body></html>
