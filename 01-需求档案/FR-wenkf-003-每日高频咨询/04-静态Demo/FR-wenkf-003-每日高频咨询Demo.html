$('#midnight').onclick=()=>{state.today=shift(state.today,1);state.clock='00:10:00';$('#demotime').textContent=`演示北京时间 ${state.today} ${state.clock}；组织：${orgName()}。`;feedback('演示时钟已跨零点，旧页面仍保留明确所属日期。点击刷新将重新计算昨日和历史日期上限。');state.target=yesterday();state.scene='pending';$('#scene').value='pending'};
$('#revoke').onclick=()=>{state.permission=!state.permission;++requestId;state.expanded.clear();state.readError=false;state.stale=false;state.loading=false;render();feedback(state.permission?'权限已恢复，请刷新重新查询。':'已模拟权限撤销，立即撤下所有受限内容及缓存。');if(state.permission)load()};
document.body.classList.toggle('embed',params.get('embed')==='1');applyScene(state.scene,true);
</script></body></html>
