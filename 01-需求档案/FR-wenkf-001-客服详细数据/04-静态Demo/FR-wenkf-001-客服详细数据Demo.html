function selectedRows(){return data[state.index].filter(r=>r.date>=state.from&&r.date<=state.to).map(r=>state.scene==='zero'?Object.fromEntries(Object.entries(r).map(([k,v])=>[k,k==='date'?v:0])):r);}
function calcRange(p){if(p==='近一月'){const date=new Date(TODAY+'T00:00:00Z');date.setUTCDate(date.getUTCDate()-29);return [date.toISOString().slice(0,10)>START?date.toISOString().slice(0,10):START,TODAY];}return p==='今日'?[TODAY,TODAY]:p==='昨日'?['2026-11-18','2026-11-18']:p==='近7天'?['2026-11-13',TODAY]:[START,TODAY];}
function skeleton(){return '<span class="skeleton" aria-label="数据加载中"></span>';}
function n(value){return state.loading||state.scene==='loading'?skeleton():fmt(value);}
function pageError(type){let info={permission:['暂无客服列表访问权限','请联系管理员确认现有角色权限。','返回客服列表'],missing:['该客服不存在或当前不可访问','请返回当前组织的客服列表重新选择。','返回客服列表'],error:['数据加载失败','查询条件已保留，请重试。','重试'],expired:['当前统计结果已失效','请刷新数据后继续查看或导出。','刷新数据']}[type];return `<div class="error-box" role="status"><div class="error-symbol">${type==='permission'?'⊘':'!'}</div><h3>${info[0]}</h3><p>${info[1]}</p><button class="${type==='permission'||type==='missing'?'':'primary'}" ${type==='permission'||type==='missing'?'data-list':'id="retry"'}>${info[2]}</button></div>`;}
function exportBox(){if(!state.exportStatus)return '';return `<div class="export-status" role="status"><div>${state.exporting?'<span class="spinner"></span>':''}${state.exportStatus==='busy'?'文件生成中，请稍候':state.exportStatus==='success'?'文件已生成 · 演示数据': '导出失败，请重试'}<small>${state.from} 至 ${state.to} · ${state.exportStatus==='success'?'示例Excel，非真实业务数据':'按当前统计截至时间导出所选范围全部记录'}</small></div>${state.exportStatus==='success'?'<button class="text" id="download">下载文件 ↓</button>':state.exportStatus==='failed'?'<button class="text" id="export-retry">重新导出</button>':''}</div>`;}
function metrics(t){return `<section class="panel summary-panel"><div class="section-head"><h2>所选日期汇总 <span class="sub">${state.preset==='全部'?'全部可统计历史':state.preset}</span></h2><span class="update">统计截至：${state.asof}（北京时间）</span></div><div class="metrics"><div class="metric-group"><div class="metric-group-label">接待数据</div><div class="metric-label">接待会话数 <button class="info-icon" data-info="按该客服首次开始接待日期统计，同一会话对同一客服只计1次。" aria-label="接待会话数口径">i</button></div><div class="metric-number">${n(t.sessions)}<small>次</small></div><div class="hint">转接会话为各接待客服分别计数</div></div><div class="metric-group"><div class="metric-group-label">服务评价</div><div class="evaluation-top"><span class="metric-label">评价数</span><span class="metric-number">${n(t.ratings)}<small>条</small></span></div><div class="satisfaction-row"><span class="metric-label">满意率 <button class="info-icon" data-info="所选范围好评数 ÷ 评价总数 × 100%；不对每日百分比求平均。无评价显示—。" aria-label="所选日期满意率说明">i</button></span><strong>${state.loading||state.scene==='loading'?'<span class="skeleton"></span>':satisfaction(t)}</strong></div><div class="evaluation-bottom">${[['好评 · 4–5星','good','good'],['中评 · 3星','neutral',''],['差评 · 1–2星','bad','bad']].map(([label,k,color])=>`<div><div class="metric-label">${label}</div><div class="mini-num ${color}">${n(t[k])}</div></div>`).join('')}</div></div><div class="metric-group ticket-group"><div class="metric-group-label">工单数据 · 按工单创建日期统计</div><div class="ticket-metrics">${[['创建工单数','created','本人创建的工单；创建本身不计入经手。'],['处理中工单数','processing','已接取且当前仍由该客服正在处理，不含待接取或已转交工单。'],['已完结工单数','closed','曾实际接取经手、当前已完结；不同客服不可直接相加为组织去重总量。']].map(([label,k,help])=>`<div><div class="metric-label">${label}<button class="info-icon" data-info="${help}" aria-label="${label}口径">i</button></div><div class="metric-number">${n(t[k])}</div></div>`).join('')}</div><div class="ticket-foot">当前状态统计，不代表历史当日状态</div></div></div>${state.scene==='zero'?'<div class="result-note">该范围暂无服务数据，每日记录保留并显示为0。</div>':''}<div class="notice"><span class="symbol">ⓘ</span><span>接待按开始接待日期、评价按提交日期、工单按创建日期统计。工单为统计截至时间的当前状态，不代表历史当日状态。</span></div><details class="rules"><summary>统计口径说明</summary><ul><li>累计接待自2026-10-30起，不受日期选择影响。转接会话为每位接待过的客服各计1次，转回不重复。</li><li>评价按提交日期统计，转接场景归属最后接待的客服。</li><li>创建行为不计入经手，实际接取才计入经手。处理中仅统计该客服当前已接取且正在处理的工单。</li><li>曾接取经手的工单完结后均计入已完结；不同客服的已完结数不可直接相加作为组织去重总量。</li><li>创建工单数与状态指标的集合不同，不要求处理中与已完结合计等于创建工单数。</li></ul></details></section>`;}
function daily(rows){const sorted=[...rows].reverse(),count=sorted.length,pages=Math.max(1,Math.ceil(count/20));state.page=Math.min(state.page,pages);const slice=sorted.slice((state.page-1)*20,state.page*20);return `<section class="panel"><div class="section-head"><h2>每日记录 <span class="sub">按日期从近到远</span></h2><span class="update">共 ${count} 天 · 导出包含全部日期记录</span></div>${state.loading||state.scene==='loading'?'<div class="loading-table" aria-label="每日记录加载中"></div>':state.scene==='pageError'?'<div class="error-box"><h3>每日记录加载失败</h3><p>汇总与统计截至时间保持不变。</p><button id="page-retry">重试</button></div>':`<div class="table-wrap"><table class="daily"><thead><tr><th>日期</th>${labels.map(l=>`<th class="num">${l}</th>`).join('')}</tr></thead><tbody>${slice.map(r=>`<tr><td>${r.date}</td>${keys.map(k=>`<td class="num ${r[k]===0?'zero':k==='good'?'good':k==='bad'?'bad':''}">${fmt(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}<div class="pagination"><span>共 ${count} 条日期记录 · 每页 20 条</span><div class="page-buttons"><button id="prev" ${state.page===1||state.loading?'disabled':''} aria-label="上一页">‹</button>${Array.from({length:pages},(_,i)=>`<button data-page="${i+1}" class="${state.page===i+1?'current':''}" ${state.loading?'disabled':''} aria-label="第${i+1}页">${i+1}</button>`).join('')}<button id="next" ${state.page===pages||state.loading?'disabled':''} aria-label="下一页">›</button></div></div></section>`;}
function detail(){const u=users[state.index],unavailable=['permission','missing'].includes(state.scene),invalid=['error','expired'].includes(state.scene),busy=state.exporting,loading=state.loading||state.scene==='loading',total=sum(selectedRows());return `<div class="shell"><button class="text back quiet" data-list>← 返回客服列表</button><div class="page-heading detail-heading"><div><div class="eyebrow">YOU BAO / SERVICE OPERATIONS</div><h1>客服详细数据</h1><p>查看单个客服的历史服务情况与每日数据。</p></div><span class="pill orange">当前组织 · 右豹</span></div>${unavailable?`<section class="panel">${pageError(state.scene)}</section>`:`<section class="panel identity-panel"><div class="identity"><div class="avatar">${u.name.startsWith('客服')?u.name.replace('客服','').trim().slice(0,1):u.name.slice(0,1)}</div><div><h2>${u.name}　${pill(u)}</h2><p>客服编号 ${u.id}<span class="id-sep">|</span>所属组织 右豹${u.disabled?' · 人员已停用':''}</p></div></div><div class="history-metrics"><div class="alltime"><label>满意率 <button class="info-icon" data-info="历史好评数 ÷ 历史评价总数 × 100%，保留两位小数；无评价显示—，不受日期筛选影响。" aria-label="历史满意率说明">i</button></label><div class="countline"><b class="satisfaction-number">${invalid?'--':loading?'<span class="skeleton"></span>':satisfaction(sum(data[state.index]))}</b></div><div class="caption">历史好评占比 · 无评价显示—</div></div><div class="alltime"><label>累计接待 <button class="info-icon" data-info="当前组织自2026-10-30起的累计接待会话次数，不受日期筛选影响。" aria-label="累计接待说明">i</button></label><div class="countline"><b>${invalid?'--':n(sum(data[state.index]).sessions)}</b><span class="muted">次</span></div><div class="caption">自2026-10-30起，不受日期筛选影响</div></div></div></section><section class="panel"><div class="toolbar"><div class="segmented" aria-label="统计日期范围">${['全部','今日','昨日','近7天','近一月','自定义'].map(p=>`<button data-preset="${p}" aria-pressed="${(state.editing?'自定义':state.preset)===p}" class="${(state.editing?'自定义':state.preset)===p?'active':''}" ${busy?'disabled title="导出中，暂不可修改查询条件"':''}>${p}</button>`).join('')}</div><div class="buttons"><button id="refresh" ${busy||state.editing||loading?'disabled':''}>↻ 刷新数据</button><button class="primary" id="export" ${busy||state.editing||loading||invalid?'disabled':''}>${busy?'<span class="spinner"></span>导出中':'↓ 导出数据'}</button></div></div>${state.editing?`<div class="custom-box"><div class="date-inputs"><label><span class="sr-only">开始日期</span><input id="from" type="date" min="${START}" max="${TODAY}" value="${state.draftFrom}" aria-describedby="date-help date-error"></label><span class="muted">至</span><label><span class="sr-only">结束日期</span><input id="to" type="date" min="${START}" max="${TODAY}" value="${state.draftTo}" aria-describedby="date-help date-error"></label><button id="query" class="primary">查询</button><button id="cancel-date">取消</button></div><p class="hint" id="date-help">自定义范围最多1年，含首尾日；全部可查看完整历史。</p><div id="date-error" class="form-error" role="alert">${state.error}</div><div class="pending">日期尚未生效，请查询或取消；下方仍为上次查询结果。</div></div>`:''}<div class="range-meta"><strong>统计范围：${state.from} 至 ${state.to}（含首尾日）${state.preset==='近一月'?' · 最近30天含今日，仅展示历史起点后的可统计日期':''}</strong><span>导出所选范围全部每日记录 · 与当前统计截至时间一致</span></div>${exportBox()}</section>${invalid?`<section class="panel">${pageError(state.scene)}</section>`:metrics(total)+daily(selectedRows())}`}<div class="footer-note">FR-wenkf-001 · 静态交互原型 · 数据及Excel均为演示数据 · 演示日期 ${TODAY}</div></div>`;}
function render(){const isDetail=state.view==='detail';$('#main').innerHTML=isDetail?detail():list();$('#crumb-detail').hidden=!isDetail;document.title=`右豹 · ${isDetail?'客服详细数据':'客服列表'} Demo`;bind();}
function resetExport(){exportId++;state.exporting=false;state.exportStatus='';if(state.exportUrl)URL.revokeObjectURL(state.exportUrl);state.exportUrl='';}
function openDetail(index){state.listScroll=window.scrollY;resetExport();queryId++;Object.assign(state,{view:'detail',index,preset:'全部',from:START,to:TODAY,page:1,editing:false,error:'',scene:'normal',loading:false,asof:stamp()});$('#scene').value='normal';render();window.scrollTo(0,0);}
function openList(){const scroll=state.listScroll;resetExport();queryId++;state.view='list';state.loading=false;state.editing=false;state.scene='normal';$('#scene').value='normal';render();window.scrollTo(0,scroll);}
function query(){const token=++queryId;resetExport();state.loading=true;state.page=1;state.scene=state.scene==='zero'?'zero':'normal';$('#scene').value=state.scene;render();setTimeout(()=>{if(token!==queryId||state.view!=='detail')return;state.loading=false;state.asof=stamp();render();},550);}
function validateDates(a,b){if(!a||!b)return'请选择完整日期范围';if(a>b)return'开始日期不能晚于结束日期';if(a<START||b<START)return'日期不能早于2026-10-30';if(a>TODAY||b>TODAY)return'日期不能晚于今日';const x=new Date(a+'T00:00:00Z');x.setUTCFullYear(x.getUTCFullYear()+1);if(new Date(b+'T00:00:00Z')>=x)return'自定义日期范围最多1年，请缩小范围或选择全部';return'';}

onclick=query;if($('#page-retry'))$('#page-retry').onclick=()=>{state.scene='normal';$('#scene').value='normal';render();};$$('[data-page]').forEach(el=>el.onclick=()=>{state.page=+el.dataset.page;render();});if($('#prev'))$('#prev').onclick=()=>{state.page--;render();};if($('#next'))$('#next').onclick=()=>{state.page++;render();};if($('#export'))$('#export').onclick=startExport;if($('#export-retry'))$('#export-retry').onclick=startExport;if($('#download'))$('#download').onclick=download;}
$('#capacity-save').onclick=()=>{const input=$('#capacity-value');if(!input.reportValidity())return;users[state.capacityIndex].capacity=Number(input.value);$('#capacity').close();render();toast('接待配额已保存，仅影响本地演示。');};
