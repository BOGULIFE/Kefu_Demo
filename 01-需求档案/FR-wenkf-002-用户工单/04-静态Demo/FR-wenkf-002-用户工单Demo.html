return `<div class="backdrop" data-action="close-detail"></div><section class="drawer" role="dialog" aria-modal="true" aria-label="工单详情"><header class="drawer-head"><b>工单详情</b>${button('×','close-detail','icon-btn','aria-label="关闭详情"')}</header><div class="drawer-body"><div class="row">${statusTag(t)}<span class="quiet">${E(t.id)}</span></div><h2>${E(t.title)}</h2>${infoPairs(t)}${t.source==='用户提交'?`<h3>用户提交内容</h3>${answerHTML(t)}`:answerHTML(t)}<div class="drawer-actions">${t.status==='处理中'?button('完结工单','finish','primary')+button(t.source==='用户提交'?'移交工单':'流转处理','transfer'):''}${t.source==='客服创建'&&t.status==='待接收'?button('接收工单','accept','primary'):''}${t.source==='客服创建'?button('补充记录','existing')+button('移交跟进客服','transfer')+(t.status==='处理中'?button('索取材料','existing')+button('调整反馈时间','existing'):'')+(t.status==='已完结'?button('重开问题','existing'):''):''}</div>${t.status==='已完结'?`<div class="result-box"><div class="row between"><strong>处理结果 · ${E(t.outcome||'已解决')}</strong><span class="tag done">用户可见</span></div><p style="margin-top:10px">${E(t.result)}</p><p class="quiet small" style="margin-top:14px">${E(t.finisher||'产品大山')} · ${E(t.finished||'2026/10/28 16:08:40')}</p></div>${t.internal?`<div class="answer"><dt>内部处理结论 <span class="tag">内部记录</span></dt><dd>${E(t.internal)}</dd></div><div class="answer"><dt>处理依据／验证记录 <span class="tag">内部记录</span></dt><dd>${E(t.evidence)}</dd></div>`:''}`:''}<h3 style="margin-top:25px">处理时间线</h3><div class="timeline">${t.events.map(ev=>`<div class="event"><div class="row"><b>${E(ev.title)}</b><span class="tag ${ev.public?'done':''}">${ev.public?'用户可见':'内部记录'}</span></div><p style="white-space:pre-wrap">${E(ev.text)}</p><div class="quiet">${E(ev.by)}<br>${E(ev.time)}</div></div>`).join('')}</div></div></section>`}
function phoneNav(title,back){return `<header class="phone-nav">${button('‹',back,'','aria-label="返回"')}<span>${title}</span><span class="capsule" aria-hidden="true">••• │ ◉</span></header>`}
function homeContent(){return `<div class="mobile-content"><div class="welcome"><div class="logo-mark">豹</div><div><b>HI，我是右豹</b><small>先看常见问题，没有答案再联系人工</small></div><span class="service">专属客服</span></div><input class="h-search" id="faq-search" placeholder="搜索您的问题，快速找到解答" aria-label="搜索常见问题"><section class="mcard"><div class="quick-grid">${['常见问题','新手教程','团队分成问题','右豹工具问题','小说短漫剧问题','收益结算问题','网盘资源问题','其它问题'].map((n,i)=>`<button class="quick-item" data-action="faq" data-title="${n}"><span class="quick-icon">${['?','▰','♟','⚒','◧','▤','▱','▦'][i]}</span>${n}</button>`).join('')}</div></section><div class="entry-grid"><button class="entry" data-action="records"><span class="entry-icon">▤</span><span class="arrow">›</span><b>工单记录</b><small>查看申请进度与处理结果</small></button><button class="entry" data-action="types"><span class="entry-icon">✎</span><span class="arrow">›</span><b>提交工单反馈</b><small>选择反馈类型并提交资料</small></button></div><section class="mcard"><h3>常见问题</h3><div class="faq-tabs"><span>热门问题</span><span>常见问题</span><span>新手教程</span><span>团队分成问题</span></div><div id="faq-items">${faqItems('')}</div></section></div><footer class="human-foot">${button('人工客服','human')}<small>在线时间 工作日 10:00–23:00 · 非服务时间可留言</small></footer>`}
const faqQuestions=['新手怎么推广，有教学吗。','我邀请的团队达人参与推广收益分成怎么算','右豹是否要收费？'];
function faqItems(q){return faqQuestions.filter(n=>n.includes(q)).map((n,i)=>`<button class="faq-item" data-action="faq" data-title="${n}"><em>${i+1}</em><span>${n}</span><span>›</span></button>`).join('')||'<p class="quiet small" style="padding-top:12px">暂无匹配问题，可咨询人工客服。</p>'}
function typesContent(){return `<div class="phone-title"><h2>选择反馈类型</h2><p class="small quiet">选择与您问题相符的反馈类型</p></div>${viewState==='loading'?loading():viewState==='error'?empty('反馈类型加载失败','','retry'):viewState==='no-types'||!db.templates.length?empty('暂无可提交的反馈类型','请稍后重试或联系人工客服。','home','返回客服首页'):db.templates.slice().sort((a,b)=>b.created.localeCompare(a.created)).map(t=>`<button class="type-row" data-action="select-type" data-id="${t.id}"><span>${E(t.name)}</span><span class="quiet">›</span></button>`).join('')}`}
function initForm(id){const t=db.templates.find(x=>x.id===id)||db.templates[0];if(!t)return;formDraft={template:clone(t),values:{},errors:{},dirty:false,unknown:false};page='form';}
function inputField(f){const v=formDraft.values[f.id];const error=formDraft.errors[f.id];let input='';if(['文本','长文本'].includes(f.type)){input=f.type==='文本'?`<input type="text" id="input-${f.id}" data-answer="${f.id}" value="${E(v||'')}" placeholder="请填写${E(f.name)}" maxlength="200" aria-describedby="error-${f.id}">`:`<textarea id="input-${f.id}" data-answer="${f.id}" rows="4" placeholder="请填写${E(f.name)}" maxlength="2000" aria-describedby="error-${f.id}">${E(v||'')}</textarea>`;input+=`<div class="count" id="count-${f.id}">${[...(v||'')].length} / ${f.type==='文本'?200:2000}</div>`}else if(['单选项','多选项'].includes(f.type)){input=`<fieldset aria-label="${E(f.name)}">${(f.options||[]).map((o,i)=>`<label class="choice"><input type="${f.type==='单选项'?'radio':'checkbox'}" name="choice-${f.id}" data-answer="${f.id}" value="${E(o)}" ${(Array.isArray(v)?v.includes(o):v===o)?'checked':''}><span>${E(o)}</span></label>`).join('')}</fieldset>`}else{const arr=v||[];input=`<div class="media-list">${arr.map((m,i)=>mediaHTML(m,f.id,i)).join('')}</div>${arr.length<(f.type==='图片'?9:1)?`<label class="upload-pick">＋ ${f.type==='图片'?'上传图片':'上传视频'}<input type="file" aria-label="上传${E(f.name)}" data-upload="${f.id}" accept="${f.type==='图片'?'image/jpeg,image/png':'.mp4,video/mp4'}" ${f.type==='图片'?'multiple':''}></label>`:''}<p class="upload-hint">${f.type==='图片'?'最多9张，JPG/JPEG/PNG，单张不超过10MB':'最多1个，MP4，大小不超过100MB'}</p>`}
 return `<div class="form-field" id="field-${f.id}"><label for="input-${f.id}">${f.required?'<span class="required">*</span>':''}${E(f.name)}${f.type==='多选项'?'<span class="quiet small">（可多选）</span>':''}</label>${input}<div class="error" id="error-${f.id}" role="alert">${E(error||'')}</div></div>`}
function mediaHTML(m,fid,i){return `<div class="media ${m.kind==='视频'?'video':''}">${button('×','remove-media','remove',`data-field="${fid}" data-index="${i}" aria-label="移除${E(m.name)}"`)}${m.kind==='图片'&&m.url?`<img src="${E(m.url)}" alt="${E(m.name)}" data-action="preview-draft" data-field="${fid}" data-index="${i}">`:m.kind==='视频'&&m.url?`<video src="${E(m.url)}" controls preload="metadata"></video>`:'<div style="padding:15px;text-align:center">▧</div>'}<div class="file-name">${E(m.name)}</div><span class="${m.status==='failed'?'error':'quiet'}">${m.status==='uploading'?'上传中…':m.status==='failed'?'上传失败':'上传成功'}</span>${m.status==='failed'?button('重试','retry-upload','link',`data-field="${fid}" data-index="${i}"`):''}</div>`}
function formContent(){if(!formDraft)initForm('t1');if(!formDraft)return empty('暂无可提交的反馈类型','','home','返回首页');return `<div class="phone-title"><h2>${E(formDraft.template.name)}</h2><p class="small quiet">请填写以下内容，带 <span class="required">*</span> 的为必填项</p></div><section class="mcard" style="padding:20px 15px"><form id="user-form" novalidate>${formDraft.template.fields.map(inputField).join('')}<div id="form-error" class="error" role="alert"></div></form></section>`}
function recordsContent(){const all=db.tickets.filter(t=>t.source==='用户提交'&&t.user===uid&&(!recordStatus||t.status===recordStatus)).sort((a,b)=>b.created.localeCompare(a.created)||b.id.localeCompare(a.id));return `<div class="row between" style="margin-bottom:12px"><p class="quiet small">查看您主动提交的反馈</p>${button('↻ 刷新','records-refresh','link')}</div><div class="status-tabs">${['','处理中','已完结'].map(n=>button(n||'全部','record-status',recordStatus===n?'active':'',`data-status="${n}"`)).join('')}</div>${viewState==='error'?empty('工单记录加载失败','','retry'):viewState==='loading'?loading():viewState==='no-records'||!all.length?empty(recordStatus?'暂无该状态的工单':'暂无工单记录','您可以提交反馈，我们将为您处理。','types','提交工单反馈'):all.slice(0,recordLimit).map(t=>`<button class="record-card" data-action="mobile-detail" data-id="${t.id}"><div class="row between"><h3>${E(t.template)}</h3>${statusTag(t)}</div><p class="quiet">${E(t.id)}</p><div class="row between small quiet"><span>${E(t.created)}</span><span>查看详情 ›</span></div></button>`).join('')+(all.length>recordLimit?button('加载更多','records-more','',`style="width:100%"`):'<p class="quiet small" style="text-align:center;padding:12px">已显示全部记录</p>')}`}
function mobileDetail(){const t=ticket();if(!canRead(t)||viewState==='permission')return empty('该工单暂不可访问','请返回您的工单记录。','records','返回工单记录');return `<div class="mobile-details"><section class="mcard"><div class="m-heading"><h3>${E(t.template)}</h3>${statusTag(t)}</div><div class="info-line"><span>工单编号</span><span>${E(t.id)}</span></div><div class="info-line"><span>提交时间</span><span>${E(t.created)}</span></div>${button('↻ 刷新状态','detail-refresh','link')}</section>${t.status==='已完结'?`<section class="mcard"><div class="m-heading"><h3>处理结果</h3><span class="tag done">${E(t.outcome||'已解决')}</span></div><p style="white-space:pre-wrap;overflow-wrap:anywhere">${E(t.result)}</p><p class="quiet small" style="margin-top:15px">完结时间：${E(t.finished)}</p></section>`:''}<section class="mcard"><h3>提交内容</h3>${answerHTML(t)}</section></div>`}
function successContent(){const t=ticket();if(!canRead(t))return empty('该工单暂不可访问','','records','返回工单记录');return `<div class="success-page"><div class="success-icon">✓</div><h2>提交成功</h2><p class="quiet small">您的反馈已收到，当前状态为处理中</p><div class="number"><small class="quiet">工单编号</small><p>${E(t.id)}</p></div>${button('查看工单','success-detail','primary')}${button('返回客服首页','home')}</div>`}
function phoneShell(){const titles={home:'在线客服',types:'选择反馈类型',form:'填写反馈',success:'提交成功',records:'工单记录',mobileDetail:'工单详情'};const back=page==='form'?'leave-form':page==='mobileDetail'?'detail-back':page==='records'||page==='types'||page==='success'?'home':'existing';let body=page==='home'?homeContent():`<div class="mobile-content">${page==='types'?typesContent():page==='form'?formContent():page==='records'?recordsContent():page==='success'?successContent():mobileDetail()}</div>`;return `<div class="phone-stage"><main class="phone">${phoneNav(titles[page]||'在线客服',back)}${body}${page==='form'?`<div class="mobile-submit">${button(formDraft?.unknown?'查询提交结果':busy?'提交中…':'提交工单',formDraft?.unknown?'resolve-submit':'submit-user','',busy?'disabled':'')}</div>`:''}</main></div>`}
function render(){demoBar();requestAnimationFrame(()=>document.documentElement.style.setProperty('--demo',document.body.classList.contains('embed')?'0px':($('#demo .demo-bar')?.offsetHeight||48)+'px'));$('#app').innerHTML=client==='admin'?adminShell(page==='templates'?templatesContent():page==='builder'?builderContent():listContent()):phoneShell();if(client==='admin'&&currentId)$('#overlay').innerHTML=drawerHTML();else if(!$('#overlay').querySelector('.dialog-wrap'))$('#overlay').innerHTML='';}
function go(p){if(busy)return;page=p;viewState='';if(client==='admin')currentId=null;$('#overlay').innerHTML='';render();window.scrollTo(0,0)}
function dialog(title,body,foot,wide=false){lastFocus=document.activeElement;dialogDirty=false;dialogBusy=false;const host=document.createElement('div');host.id='dialog-host';host.innerHTML=`<div class="dialog-wrap"><section class="dialog" role="dialog" aria-modal="true" aria-label="${E(title)}" ${wide?'style="width:660px"':''}><div class="dialog-head"><h3>${title}</h3>${button('×','close-dialog','icon-btn','aria-label="关闭弹窗"')}</div><div class="dialog-content">${body}<div id="dialog-error" class="error" role="alert"></div></div><div class="dialog-foot">${foot}</div></section></div>`;$('#overlay').append(host);setTimeout(()=>host.querySelector('textarea,input,select,button')?.focus(),10)}
function closeDialog(force=false){if(dialogBusy&&!force)return;if(dialogDirty&&!force){requestConfirm('放弃本次填写内容？',()=>closeDialog(true));return;}$('#dialog-host')?.remove();dialogDirty=false;lastFocus?.focus()}
function errDialog(s){$('#dialog-error').textContent=s}
let confirmCallback=null;function requestConfirm(message,fn){confirmCallback=fn;$('#confirm-host')?.remove();const host=document.createElement('div');host.id='confirm-host';host.innerHTML=`<div class="dialog-wrap" style="z-index:95"><section class="dialog" role="dialog" aria-modal="true" aria-label="确认操作"><div class="dialog-head"><h3>确认操作</h3></div><div class="dialog-content">${E(message)}</div><div class="dialog-foot">${button('取消','cancel-confirm')}${button('确认','accept-confirm','primary')}</div></section></div>`;$('#overlay').append(host);host.querySelector('button')?.focus()}
function takeFault(){const f=fault;fault='';demoBar();return f}
function openFinish(){const t=ticket();if(!canEdit(t))return toast('当前工单不可完结，请刷新后查看。');opVersion=t.version;dialog('完结工单',`<form id="finish-form"><label style="margin-top:0">处理结果 <span class="required">*</span></label><div class="segments">${['已解决','未解决','转需求'].map((n,i)=>`<label><input type="radio" name="outcome" value="${n}" ${i===0?'checked':''}><span>${n}</span></label>`).join('')}</div><label for="internal">内部处理结论 <span class="required">*</span></label><textarea id="internal" name="internal" rows="2" maxlength="2000"></textarea><div id="err-internal" class="error"></div><label for="evidence">处理依据／验证记录 <span class="required">*</span></label><textarea id="evidence" name="evidence" rows="2" maxlength="2000"></textarea><div id="err-evidence" class="error"></div><label for="public-result">面向用户的结果说明 <span class="required">*</span></label><textarea id="public-result" name="result" rows="2" maxlength="2000" placeholder="这段内容会展示给用户，请使用易懂的语言"></textarea><div id="err-result" class="error"></div><div class="count" id="result-count">0 / 2000</div><p class="quiet small">内部处理结论及验证记录仅后台可见。</p></form>`,button('取消','close-dialog')+button('确认提交','confirm-finish','primary'),true)}
function openTransfer(){const t=ticket();if(!canRead(t)||t.source==='用户提交'&&!canEdit(t))return toast('当前工单不可移交。');opVersion=t.version;dialog(t.source==='用户提交'?'移交工单':'移交跟进客服',`<p class="small quiet">当前负责人：${E(staff[t.owner])}</p><label for="staff-search">搜索接收客服</label><input id="staff-search" placeholder="输入客服名称"><label for="transfer-owner"><span class="required">*</span>接收客服</label><select id="transfer-owner"><option value="">请选择其他客服</option>${Object.entries(staff).filter(([id])=>id!==t.owner).map(([id,n])=>`<option value="${id}">${n}</option>`).join('')}</select><div class="notice" style="margin-top:18px">${t.source==='用户提交'?'移交后仍为处理中，接收客服无需接取。':'客服创建工单保留原有接收流程。'}</div>`,button('取消','close-dialog')+button('确认移交','confirm-transfer','primary'))}
async function finish(){const t=ticket();if(dialogBusy)return;const values=Object.fromEntries(new FormData($('#finish-form')));let bad=false;for(const n of ['internal','evidence','result']){const message=!values[n]?.trim()?`请填写${{internal:'内部处理结论',evidence:'处理依据／验证记录',result:'面向用户的结果说明'}[n]}。`:[...values[n]].length>2000?'最多2000个字符。':'';$('#err-'+n).textContent=message;if(message&&!bad){$(`[name="${n}"]`).focus();bad=true}}if(bad)return;const f=takeFault();if(f==='conflict'){t.owner=t.owner==='b'?'a':'b';t.version++;persist()}if(!canEdit(t)||t.version!==opVersion){errDialog('工单信息已变化，请关闭弹窗并刷新后查看。');return}dialogBusy=true;$('#dialog-host [data-action="confirm-finish"]').disabled=true;await delay(400);if(f==='fail'){dialogBusy=false;$('#dialog-host [data-action="confirm-finish"]').disabled=false;return errDialog('提交失败，填写内容已保留，请重试。')}t.status='已完结';t.outcome=values.outcome;t.internal=values.internal.trim();t.evidence=values.evidence.trim();t.result=values.result.trim();t.finished=now();t.finisher=isAdmin()?'系统管理员':staff[actor()];t.version++;t.events.push({title:'处理结论',text:t.internal+'\n验证记录：'+t.evidence,by:t.finisher,time:t.finished,public:false},{title:'公开结果',text:t.result,by:t.finisher,time:t.finished,public:true});persist();closeDialog(true);$('#overlay').innerHTML='';render();toast('工单已完结，面向用户的结果说明已保存。')}
async function transfer(){const t=ticket(),owner=$('#transfer-owner').value;if(dialogBusy)return;if(!owner||!staff[owner]||owner===t.owner)return errDialog('请选择有效的其他客服。');const f=takeFault();if(f==='conflict'){t.version++;t.owner=owner;persist()}if(!canRead(t)||t.version!==opVersion||t.source==='用户提交'&&t.status!=='处理中')return errDialog('工单信息已变化，请关闭并刷新后查看。');if(f==='fail')return errDialog('移交失败，已保留接收人，请重试。');dialogBusy=true;$('#dialog-host [data-action="confirm-transfer"]').disabled=true;await delay(350);const prev=staff[t.owner];t.owner=owner;t.status=t.source==='用户提交'?'处理中':'待接收';t.version++;t.events.push({title:'移交工单',text:prev+' → '+staff[owner],by:isAdmin()?'系统管理员':staff[actor()],time:now(),public:false});persist();closeDialog(true);if(!isAdmin())currentId=null;$('#overlay').innerHTML='';render();toast('已移交给'+staff[owner])}
const delay=ms=>new Promise(r=>setTimeout(r,ms));
async function query(form){if(busy)return;const draft=form?Object.fromEntries(new FormData(form)):applied;busy=true;viewState='loading';applied={...draft,keyword:draft.keyword.trim()};pageNo=1;render();const f=takeFault();await delay(400);busy=false;viewState=f==='fail'?'error':'';render()}
function buildSync(){if(!builder)return;builder.name=$('#template-name')?.value||builder.name;builder.owner=$('#template-owner')?.value||builder.owner;}
function newField(){return {id:'f'+Date.now()+Math.floor(Math.random()*99),name:'',type:'文本',required:false}}
function validateBuilder(){buildSync();let error='';if(!builder.name.trim())error='请填写工单类型名称。';else if(db.templates.some(t=>t.name===builder.name.trim()))error='工单类型名称已存在。';else if(!staff[builder.owner])error='请选择有效的默认处理人。';else if(!builder.fields.length)error='请至少添加一个字段。';const seen=new Set();let badField=null;for(const f of builder.fields){if(error)break;let e='';if(!f.name.trim())e='请填写字段名称。';else if(seen.has(f.name.trim()))e='同一模板的字段名称不可重复。';seen.add(f.name.trim());if(['单选项','多选项'].includes(f.type)){const os=(f.options||[]).map(o=>o.trim());if(os.length<2||os.length>20||os.some(o=>!o)||new Set(os).size!==os.length)e='单选／多选需配置2—20个非空且不重复的选项。'}if(e){error=e;badField=f.id}}if(error){$('#builder-error').textContent=error;const target=badField?document.querySelector(`[data-field="${badField}"]`):$('#template-name');target?.scrollIntoView({block:'center',behavior:'smooth'});target?.querySelector('input')?.focus();return false}return true}
async function saveTemplate(){if(busy||!isAdmin()||!validateBuilder())return;const f=takeFault();if(f==='fail')return $('#builder-error').textContent='保存失败，配置已保留，请重试。';const b=clone(builder);busy=true;document.querySelector('[data-action="save-template"]').disabled=true;await delay(350);busy=false;db.templates.push({id:'t'+Date.now(),name:b.name.trim(),owner:b.owner,fields:b.fields.map(x=>({...x,name:x.name.trim(),options:x.options?.map(o=>o.trim())})),created:now()});persist();builder=null;go('templates');toast('工单类型已保存，用户可在H5选择。')}
function setFormError(id,msg){formDraft.errors[id]=msg;const el=$('#error-'+id);if(el)el.textContent=msg}
function validateForm(){let first=null;formDraft.errors={};for(const f of formDraft.template.fields){const v=formDraft.values[f.id];let error='';if(['图片','视频'].includes(f.type)){if(v?.some(m=>m.status!=='success'))error='请完成上传，或移除失败的文件后再提交。';else if(f.required&&!v?.length)error='请上传'+f.name+'。'}else if(f.required&&(!v||!v.length||typeof v==='string'&&!v.trim()))error=(['单选项','多选项'].includes(f.type)?'请选择':'请填写')+f.name+'。';else if(['单选项','多选项'].includes(f.type)&&v&&!(Array.isArray(v)?v:[v]).every(x=>f.options.includes(x)))error='选项已变化，请重新选择。';if(error&&!first)first=f.id;setFormError(f.id,error)}if(first){$('#field-'+first)?.scrollIntoView({block:'center',behavior:'smooth'});$('#field-'+first)?.querySelector('input,textarea')?.focus();return false}return true}
function createUserTicket(){if(pendingTicket)return pendingTicket;const t=formDraft.template,id='TK'+Date.now();pendingTicket={id,title:t.name,source:'用户提交',template:t.name,templateId:t.id,user:uid,owner:t.owner,status:'处理中',priority:'普通',created:now(),next:'—',fields:clone(t.fields),answers:clone(formDraft.values),outcome:'',result:'',version:1,events:[{title:'提交工单',text:'用户提交反馈，已自动指派给'+staff[t.owner],by:'用户 '+uid,time:now(),public:true}]};db.tickets.unshift(pendingTicket);persist();return pendingTicket}
async function submitUser(){if(busy||!formDraft||formDraft.unknown||!validateForm())return;const f=takeFault();if(f==='unavailable')return $('#form-error').textContent='该反馈类型暂不可用，已保留本次填写内容，请稍后重试。';busy=true;const btn=document.querySelector('[data-action="submit-user"]');btn.disabled=true;btn.textContent='提交中…';await delay(500);busy=false;if(f==='fail'){btn.disabled=false;btn.textContent='提交工单';return $('#form-error').textContent='提交失败，本次填写内容已保留，请重试。'}const t=createUserTicket();currentId=t.id;if(f==='unknown'){formDraft.unknown=true;render();$('#form-error').textContent='正在确认提交结果，请勿重复申请。';return}formDraft=null;pendingTicket=null;page='success';render();window.scrollTo(0,0)}

async function upload(input){if(!formDraft)return;const fid=input.dataset.upload,f=formDraft.template.fields.find(x=>x.id===fid),arr=formDraft.values[fid]||[],files=[...input.files],limit=f.type==='图片'?9:1;let error='';for(const file of files){if(arr.length>=limit){error='超过该字段允许的文件数量。';break}const image=f.type==='图片',valid=image?/\.(png|jpe?g)$/i.test(file.name)&&['image/jpeg','image/png'].includes(file.type):/\.mp4$/i.test(file.name)&&(!file.type||file.type==='video/mp4');if(!valid){error='文件格式不支持，请按说明重新选择。';continue}if(file.size>(image?10:100)*1024*1024){error='文件超出大小限制，请重新选择。';continue}const url=await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(file)});const m={name:file.name,url,status:'uploading',kind:f.type};arr.push(m);const fail=fault==='upload';if(fail)takeFault();settleUpload(m,fid,fail)}formDraft.values[fid]=arr;formDraft.dirty=true;formDraft.errors[fid]=error;const node=$('#field-'+fid);node.outerHTML=inputField(f)}

 'client-admin':()=>{client='admin';applyScene('unified-list')},'client-h5':()=>{client='h5';applyScene('home')},tools:()=>{toolsOpen=!toolsOpen;demoBar()},reset:()=>requestConfirm('重置本Demo的模拟数据？',()=>{db=seed();persist();applyScene(client==='admin'?'unified-list':'home');toast('演示数据已重置。')}),list:()=>go('list'),templates:()=>go('templates'),builder:()=>{builder=blankBuilder();go('builder')},'leave-builder':()=>{buildSync();const leave=()=>{builder=null;go('templates')};if(builder?.dirty)requestConfirm('放弃尚未保存的模板配置？',leave);else leave()},existing,'legacy-create':existing,refresh:()=>query(),retry:()=>{viewState='';render()},prev:()=>{pageNo--;render()},next:()=>{pageNo++;render()},detail:el=>{currentId=el.dataset.id;$('#overlay').innerHTML=drawerHTML();setTimeout(()=>$('#overlay .icon-btn')?.focus(),0)},'close-detail':()=>{if($('#dialog-host'))return;currentId=null;$('#overlay').innerHTML='';render()},finish:openFinish,transfer:openTransfer,'close-dialog':()=>closeDialog(),'confirm-finish':finish,'confirm-transfer':transfer,accept:()=>{const t=ticket();if(!canRead(t)||t.status!=='待接收')return;t.status='处理中';t.version++;t.events.push({title:'接收工单',text:'已接收并开始处理',by:staff[actor()],time:now(),public:false});persist();render();toast('工单已接收。')},
 'add-field':()=>{buildSync();builder.fields.push(newField());builder.dirty=true;render()},'field-up':el=>moveField(el,-1),'field-down':el=>moveField(el,1),'field-delete':el=>{buildSync();builder.fields=builder.fields.filter(f=>f.id!==el.dataset.id);builder.dirty=true;render()},'option-add':el=>{buildSync();const f=builder.fields.find(f=>f.id===el.dataset.id);f.options.push('');builder.dirty=true;render()},'option-delete':el=>{buildSync();builder.fields.find(f=>f.id===el.dataset.id).options.splice(+el.dataset.index,1);builder.dirty=true;render()},'save-template':saveTemplate,

document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;if(el.closest('#demo')||el.closest('#app')||el.closest('#overlay')){const fn=actions[el.dataset.action];if(fn){e.preventDefault();Promise.resolve(fn(el)).catch(err=>{console.error(err);toast('演示操作未完成，请重试。')})}}});
